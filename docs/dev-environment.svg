<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1030" width="1400" height="1030" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <style>
      .t  { font-size: 15px; fill: #0f172a; }
      .tb { font-size: 15px; fill: #0f172a; font-weight: 600; }
      .s  { font-size: 12.5px; fill: #475569; }
      .lbl{ font-size: 12.5px; fill: #334155; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
      .lblO{ font-size: 12.5px; fill: #c2410c; paint-order: stroke; stroke: #fff; stroke-width: 4px; font-weight: 600; }
      .zone { font-size: 13px; fill: #64748b; font-weight: 600; letter-spacing: .04em; }
      .svc { fill: #e8f1fb; stroke: #2563eb; stroke-width: 1.6; }
      .db  { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
      .ext { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.3; }
      .rest { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .evt  { stroke: #ea580c; stroke-width: 1.8; fill: none; marker-end: url(#arrO); }
    </style>
  </defs>

  <rect width="1400" height="1030" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#0f172a">Car Rental System — development environment</text>

  <!-- ===== Developer ===== -->
  <rect x="40" y="70" width="270" height="100" rx="18" class="ext"/>
  <text x="175" y="105" text-anchor="middle" class="tb">Developer machine</text>
  <text x="175" y="128" text-anchor="middle" class="s">browser · Swagger · Rider · DB tool</text>
  <text x="175" y="150" text-anchor="middle" class="s">docker compose up --build</text>

  <!-- ===== GitHub ===== -->
  <rect x="370" y="60" width="990" height="120" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <text x="385" y="80" class="zone">GITHUB</text>
  <rect x="395" y="92" width="250" height="72" rx="6" class="ext"/>
  <text x="520" y="120" text-anchor="middle" class="tb">Repository</text>
  <text x="520" y="142" text-anchor="middle" class="s">Dockerfiles · compose · .env.example</text>
  <rect x="725" y="92" width="250" height="72" rx="6" class="ext"/>
  <text x="850" y="120" text-anchor="middle" class="tb">GitHub Actions</text>
  <text x="850" y="142" text-anchor="middle" class="s">matrix: 1 image build per service</text>
  <rect x="1055" y="92" width="285" height="72" rx="6" class="ext"/>
  <text x="1197" y="120" text-anchor="middle" class="tb">GHCR (container registry)</text>
  <text x="1197" y="142" text-anchor="middle" class="s">ghcr.io/&lt;owner&gt;/carrental-*:latest</text>
  <path d="M645 128 H721" class="rest"/>
  <text x="683" y="120" text-anchor="middle" class="lbl">push</text>
  <path d="M975 128 H1051" class="rest"/>
  <text x="1013" y="120" text-anchor="middle" class="lbl">push</text>

  <!-- ===== Docker host ===== -->
  <rect x="40" y="220" width="1320" height="755" rx="10" fill="#fafafa" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="58" y="244" class="zone">DOCKER HOST · docker-compose.yml · configuration from global .env</text>

  <path d="M175 170 V216" class="rest"/>
  <text x="185" y="200" class="lbl">localhost:6001–6005/swagger · :15672 · :5433–5436</text>
  <path d="M1197 164 V216" class="rest" stroke-dasharray="5 4"/>
  <text x="1207" y="200" class="lbl">docker compose pull</text>

  <!-- backend network -->
  <rect x="60" y="258" width="1280" height="400" rx="8" fill="#f8fbff" stroke="#93c5fd" stroke-dasharray="6 4"/>
  <text x="76" y="280" class="zone" fill="#2563eb">NETWORK: backend</text>

  <!-- RabbitMQ -->
  <rect x="570" y="292" width="740" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="940" y="320" text-anchor="middle" class="tb" fill="#7c2d12">RabbitMQ — single broker instance</text>
  <text x="940" y="343" text-anchor="middle" class="s">topic exchange "carrental.events" · AMQP 5672 · management UI 15672</text>

  <!-- Services -->
  <g>
    <rect x="90" y="480" width="190" height="80" rx="6" class="svc"/>
    <text x="185" y="512" text-anchor="middle" class="tb">car-service</text>
    <text x="185" y="535" text-anchor="middle" class="s">:8080 → localhost:6002</text>

    <rect x="330" y="480" width="190" height="80" rx="6" class="svc"/>
    <text x="425" y="512" text-anchor="middle" class="tb">user-service</text>
    <text x="425" y="535" text-anchor="middle" class="s">:8080 → localhost:6001</text>

    <rect x="570" y="480" width="190" height="80" rx="6" class="svc"/>
    <text x="665" y="512" text-anchor="middle" class="tb">booking-service</text>
    <text x="665" y="535" text-anchor="middle" class="s">:8080 → localhost:6003</text>

    <rect x="810" y="480" width="190" height="80" rx="6" class="svc"/>
    <text x="905" y="512" text-anchor="middle" class="tb">payment-service</text>
    <text x="905" y="535" text-anchor="middle" class="s">:8080 → localhost:6005</text>

    <rect x="1050" y="480" width="230" height="80" rx="6" class="svc"/>
    <text x="1165" y="512" text-anchor="middle" class="tb">notification-service</text>
    <text x="1165" y="535" text-anchor="middle" class="s">:8080 → localhost:6004</text>
  </g>

  <!-- REST (sync) -->
  <path d="M600 480 C600 335, 205 335, 205 476" class="rest"/>
  <text x="398" y="378" text-anchor="middle" class="lbl">REST: availability / reserve</text>
  <path d="M584 480 C584 425, 450 425, 450 476" class="rest"/>
  <text x="517" y="432" text-anchor="middle" class="lbl">REST: eligibility</text>
  <path d="M860 560 C860 625, 720 625, 720 564" class="rest"/>
  <text x="790" y="630" text-anchor="middle" class="lbl">REST: confirm booking</text>

  <!-- Events (async) -->
  <path d="M620 480 V366" class="evt"/>
  <text x="626" y="400" class="lblO">publish</text>
  <text x="626" y="415" class="lblO">booking.confirmed</text>
  <path d="M748 362 V476" class="evt"/>
  <text x="734" y="448" text-anchor="end" class="lblO" dx="8">consume</text>
  <text x="734" y="463" text-anchor="end" class="lblO" dx="8">payment.failed</text>
  <path d="M925 480 V366" class="evt"/>
  <text x="931" y="415" class="lblO">publish</text>
  <text x="931" y="430" class="lblO">payment.failed</text>
  <path d="M1165 362 V476" class="evt"/>
  <text x="1171" y="415" class="lblO">consume</text>
  <text x="1171" y="430" class="lblO">booking.confirmed</text>

  <!-- ===== Databases: one server + one private network each ===== -->
  <g>
    <!-- car -->
    <rect x="80" y="685" width="210" height="185" rx="8" fill="#f7fdf9" stroke="#6ee7b7" stroke-dasharray="5 4"/>
    <text x="92" y="860" class="zone" fill="#059669">car-db-net</text>
    <path d="M130 728 a55 11 0 0 0 110 0 v92 a55 11 0 0 1 -110 0 z" class="db"/>
    <ellipse cx="185" cy="728" rx="55" ry="11" class="db"/>
    <text x="185" y="770" text-anchor="middle" class="tb">car-db</text>
    <text x="185" y="789" text-anchor="middle" class="s">PostgreSQL 16</text>
    <text x="185" y="808" text-anchor="middle" class="s">localhost:5434</text>

    <!-- user -->
    <rect x="320" y="685" width="210" height="185" rx="8" fill="#f7fdf9" stroke="#6ee7b7" stroke-dasharray="5 4"/>
    <text x="332" y="860" class="zone" fill="#059669">user-db-net</text>
    <path d="M370 728 a55 11 0 0 0 110 0 v92 a55 11 0 0 1 -110 0 z" class="db"/>
    <ellipse cx="425" cy="728" rx="55" ry="11" class="db"/>
    <text x="425" y="770" text-anchor="middle" class="tb">user-db</text>
    <text x="425" y="789" text-anchor="middle" class="s">PostgreSQL 16</text>
    <text x="425" y="808" text-anchor="middle" class="s">localhost:5433</text>

    <!-- booking -->
    <rect x="560" y="685" width="210" height="185" rx="8" fill="#f7fdf9" stroke="#6ee7b7" stroke-dasharray="5 4"/>
    <text x="572" y="860" class="zone" fill="#059669">booking-db-net</text>
    <path d="M610 728 a55 11 0 0 0 110 0 v92 a55 11 0 0 1 -110 0 z" class="db"/>
    <ellipse cx="665" cy="728" rx="55" ry="11" class="db"/>
    <text x="665" y="770" text-anchor="middle" class="tb">booking-db</text>
    <text x="665" y="789" text-anchor="middle" class="s">PostgreSQL 16</text>
    <text x="665" y="808" text-anchor="middle" class="s">localhost:5435</text>

    <!-- payment -->
    <rect x="800" y="685" width="210" height="185" rx="8" fill="#f7fdf9" stroke="#6ee7b7" stroke-dasharray="5 4"/>
    <text x="812" y="860" class="zone" fill="#059669">payment-db-net</text>
    <path d="M850 728 a55 11 0 0 0 110 0 v92 a55 11 0 0 1 -110 0 z" class="db"/>
    <ellipse cx="905" cy="728" rx="55" ry="11" class="db"/>
    <text x="905" y="770" text-anchor="middle" class="tb">payment-db</text>
    <text x="905" y="789" text-anchor="middle" class="s">PostgreSQL 16</text>
    <text x="905" y="808" text-anchor="middle" class="s">localhost:5436</text>

    <!-- notification: none -->
    <rect x="1050" y="685" width="230" height="185" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="3 5"/>
    <text x="1165" y="770" text-anchor="middle" class="t">no database</text>
    <text x="1165" y="792" text-anchor="middle" class="s">(by design)</text>
  </g>

  <!-- service ↔ own database -->
  <g stroke="#059669" stroke-width="1.8">
    <line x1="185" y1="560" x2="185" y2="717"/>
    <line x1="425" y1="560" x2="425" y2="717"/>
    <line x1="665" y1="560" x2="665" y2="717"/>
    <line x1="905" y1="560" x2="905" y2="717"/>
  </g>
  <line x1="1165" y1="560" x2="1165" y2="685" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3 5"/>

  <!-- volumes -->
  <rect x="80" y="900" width="1200" height="52" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="100" y="932" class="t"><tspan font-weight="600">Named volumes</tspan> (data survives docker compose down):  user-db-data · car-db-data · booking-db-data · payment-db-data · rabbitmq-data</text>

  <!-- legend -->
  <g transform="translate(40,1000)">
    <line x1="0" y1="0" x2="34" y2="0" class="rest"/>
    <text x="42" y="5" class="s">synchronous REST (HTTP, Docker DNS: http://&lt;service&gt;:8080)</text>
    <line x1="470" y1="0" x2="504" y2="0" class="evt"/>
    <text x="512" y="5" class="s">asynchronous event via RabbitMQ</text>
    <line x1="760" y1="0" x2="794" y2="0" stroke="#059669" stroke-width="1.8"/>
    <text x="802" y="5" class="s">service ↔ its own database (private network)</text>
    <rect x="1110" y="-8" width="16" height="16" rx="3" fill="none" stroke="#93c5fd" stroke-dasharray="4 3"/>
    <text x="1134" y="5" class="s">Docker network</text>
  </g>
</svg>
